});
document.querySelector('#pause').addEventListener('click',togglePause);
document.querySelector('#music').addEventListener('click',toggleMusic);

let swipeStart=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}}},{passive:true});renderer.domElement.addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>28)move(dx>0?1:-1);else if(dy>24)crouch();else if(dy< -24)jump()},{passive:true});renderer.domElement.addEventListener('pointercancel',()=>{swipeStart=null},{passive:true});
function update(dt){
 // Four readable one-minute stages, followed by endless record mode.
 runTime+=dt;
 const difficulty=THREE.MathUtils.clamp(runTime/240,0,1);
 const stageName=runTime<60?'COAST':runTime<120?'TRAFFIC':runTime<180?'WILDLIFE':runTime<240?'RUSH':'RECORD';
 const timeLabel=Math.floor(runTime/60)+':'+String(Math.floor(runTime%60)).padStart(2,'0');
 document.querySelector('#runTime').textContent=timeLabel;
 document.querySelector('#stage').textContent=stageName;
 speed=20+difficulty*10;
 dist+=dt*speed*crashSlow;if(crashTimer>0){
 crashTimer-=dt;crashSlow=THREE.MathUtils.damp(crashSlow,1,2.2,dt);
 const tumbleTime=1.55-crashTimer;
 if(tuk.userData.crashing){
  tuk.rotation.z+=tuk.userData.crashSpin*dt*7.5;
  tuk.rotation.x+=dt*4.2;
  tuk.position.y=Math.max(0,Math.sin(Math.min(1,tumbleTime/1.15)*Math.PI)*1.25);
  tuk.position.x+=tuk.userData.crashSpin*dt*.65;
 }
 if(crashTimer<=0){tuk.userData.crashing=false;finish();return}
}spawn-=dt;coinTimer-=dt;if(spawn<=0){let r=Math.random();
 let obstacleType;
 if(runTime<60){
  obstacleType=r<.34?'bus':r<.62?'trafficTuk':r<.82?'lizard':'bat';
 }else if(runTime<120){
  obstacleType=r<.40?'bus':r<.72?'trafficTuk':r<.87?'lizard':'bat';
 }else if(runTime<180){
  obstacleType=r<.28?'bus':r<.52?'trafficTuk':r<.78?'lizard':'bat';
 }else{
  obstacleType=r<(.34+difficulty*.04)?'bus':
   r<(.58+difficulty*.05)?'trafficTuk':
   r<(.82+difficulty*.04)?'lizard':'bat';
 }
 obstacle(obstacleType,Math.floor(Math.random()*3)-1,obstacleType==='bat'?-105:-115);
 if(obstacleType==='bat'){
  const bat=objects[objects.length-1];bat.position.y=3.65;
 }
 // Early game has generous gaps; later stages gradually tighten the rhythm.
 spawn=(1.48-difficulty*.48)+Math.random()*(.30-difficulty*.10);
 }if(coinTimer<=0){let l=Math.floor(Math.random()*3)-1;for(let i=0;i<5;i++)coin(l,-55-i*4);coinTimer=1.5+Math.random()*1.2}
jumpY+=jumpV*dt;jumpV-=25*dt;
 if(jumpY<0){jumpY=0;jumpV=0}
 duck=Math.max(0,duck-dt);wheels.forEach(w=>w.rotation.x-=speed*dt*1.6);dustPuffs.forEach((p,i)=>{p.position.x=tuk.position.x+Math.sin(performance.now()*.004+i*2)*.55;p.position.z=4.9+(i%4)*.18;p.position.y=.2+((performance.now()*.001+i*.17)%1)*.55;p.material.opacity=.10+Math.sin(performance.now()*.006+i)*.06;p.scale.setScalar(.65+((performance.now()*.001+i*.13)%1)*.8)});tuk.position.x=THREE.MathUtils.damp(tuk.position.x,laneX[lane+1],11,dt);const roadBob=Math.sin(performance.now()*.014)*.035+Math.sin(performance.now()*.006)*.018;
 tuk.position.y=jumpY*.65+(jumpY===0?roadBob:0);
 tuk.rotation.z=THREE.MathUtils.damp(tuk.rotation.z,(laneX[lane+1]-tuk.position.x)*-.13,7,dt);
 tuk.rotation.x=THREE.MathUtils.damp(tuk.rotation.x,Math.sin(performance.now()*.012)*.018,5,dt);
 tuk.scale.y=duck>0?.546:.7;
markers.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>12)m.position.z=-120});edgeLines.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>12)m.position.z=-120});waves.forEach((w,i)=>{w.position.z+=speed*dt*.55;if(w.position.z>12)w.position.z=-145;w.position.x+=Math.sin(performance.now()*.0007+i)*dt*.05});shrubs.forEach(p=>{p.position.z+=speed*dt;if(p.position.z>15)p.position.z-=156});palms.forEach(p=>{p.position.z+=speed*dt;if(p.position.z>15)p.position.z-=144;p.userData.crown.rotation.z=Math.sin(performance.now()*.0014+p.userData.phase)*.055;p.userData.crown.rotation.x=Math.cos(performance.now()*.0011+p.userData.phase)*.035});scenery.forEach(p=>{p.position.z+=speed*dt;if(p.position.z>18)p.position.z-=150});clouds.forEach((c,i)=>{c.position.x+=dt*(.25+i*.025);if(c.position.x>35)c.position.x=-35});
 bridges.forEach(b=>{b.position.z+=speed*crashSlow*dt;if(b.position.z>18)b.position.z-=204});
 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=12*dt;p.mesh.material.opacity=Math.max(0,p.life);if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();sparks.splice(i,1)}}
for(const o of objects){
 // Buses always advance along their own forward trajectory, including during a roof ride.
 o.position.z+=speed*dt;
 if(o.userData.type==='trafficTuk'){
  const phase=performance.now()*.0018+o.userData.phase+o.position.z*.012;
  const drift=Math.sin(phase)*.22 + Math.sin(phase*.47)*.07;
  o.position.x=THREE.MathUtils.damp(o.position.x,o.userData.baseX+drift,3.2,dt);
  o.position.y=.006+Math.abs(Math.sin(phase*2.4))*.012;
  o.rotation.z=Math.sin(phase*1.1)*.008;
  o.rotation.y=Math.cos(phase*.8)*.012;
  if(o.userData.tukWheels)o.userData.tukWheels.forEach(w=>w.rotation.x-=speed*dt*2.35);
 }
 if(o.userData.type==='lizard'){
  const phase=performance.now()*.0036+o.userData.phase;
  o.position.x=o.userData.baseX+Math.sin(phase*.32)*.10;
  o.position.y=.006+Math.abs(Math.sin(phase*2))*.012;
  o.rotation.y=Math.sin(phase*.32)*.025;
  if(o.userData.lizardLegs)o.userData.lizardLegs.forEach(leg=>{
   const step=Math.sin(phase*2+leg.phase);
   leg.mesh.rotation.z=leg.base+step*.34;
  });
  if(o.userData.lizardFeet)o.userData.lizardFeet.forEach(foot=>{
   const step=Math.sin(phase*2+foot.phase);
   foot.mesh.position.x=foot.baseX+step*.09;
   foot.mesh.position.z=foot.baseZ+Math.max(0,step)*.045;
  });
 }
 if(o.userData.type==='bat'){
  const phase=performance.now()*.006+o.userData.phase;
  o.position.x=o.userData.baseX+Math.sin(phase)*.7;
  o.position.y=3.65+Math.sin(phase*2)*.22;
  if(o.userData.leftWing)o.userData.leftWing.rotation.z=Math.sin(phase*2.5)*.55;
  if(o.userData.rightWing)o.userData.rightWing.rotation.z=-Math.sin(phase*2.5)*.55;
 }
 if(o.userData.type==='bus'){
  const phase=performance.now()*.0018+o.userData.phase+o.position.z*.018;
  const drift=Math.sin(phase)*.28;
  o.position.x=THREE.MathUtils.damp(o.position.x,o.userData.baseX+drift,2.4,dt);
  o.position.y=.025+Math.sin(phase*2.1)*.035;
  o.rotation.z=Math.sin(phase*1.15)*.012;
  o.rotation.y=Math.cos(phase*.8)*.025;
  if(o.userData.busWheels)o.userData.busWheels.forEach(w=>w.rotation.x-=speed*dt*1.55);
 }
 if(o.userData.coin){o.rotation.z+=dt*2.8;if(!o.userData.got&&Math.abs(o.position.z-tuk.position.z)<2.4&&o.userData.lane===lane+1){o.userData.got=true;coins++;document.querySelector('#coins').textContent=coins;o.visible=false}}else if(!o.userData.hit&&Math.abs(o.position.z-tuk.position.z)<2.65&&Math.abs(o.position.x-tuk.position.x)<1.7){
  if(o.userData.type==='bus' || o.userData.type==='trafficTuk'){
   // Both buses and oncoming tuk-tuks are cleared by a properly timed jump.
   if(jumpY>2.15)continue;
  }
  if(o.userData.type==='bat' && jumpY<2.4)continue;
  o.userData.hit=true;
  if((o.userData.type==='lizard'&&jumpY>.65)||(o.userData.type==='barrier'&&jumpY>1.15))continue;
  triggerCrash();return
 }}
objects=objects.filter(o=>{
 if(o.position.z>18){
  scene.remove(o);return false;
 }
 return true;
});document.querySelector('#distance').textContent=Math.floor(dist)}
function render(t){
 const shake=crashTimer>0?crashTimer*crashTimer*1.8:0;
 camera.position.y=5.7+(shake?Math.sin(t*.065)*shake*.22:0);
 camera.position.x=THREE.MathUtils.damp(camera.position.x,tuk.position.x*.22+(shake?Math.sin(t*.09)*shake*.28:0),2,1/60);
 camera.position.z=THREE.MathUtils.damp(camera.position.z,tuk.position.z+7.8,5,1/60);
 camera.lookAt(tuk.position.x*.12,1.15,tuk.position.z-9);
 renderer.render(scene,camera);
}
function loop(now){if(!running)return;if(!paused){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt)}else{last=now}camera.position.x=THREE.MathUtils.damp(camera.position.x,tuk.position.x*.22,2,1/60);camera.position.z=11.8;camera.lookAt(tuk.position.x*.12,1.15,-5);render(now);if(running)requestAnimationFrame(loop)}
function idle(){render(performance.now());requestAnimationFrame(idle)}idle();
window.__tukGameReady=true;
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(running&&!paused)pauseGame()}else{last=performance.now()}});
 function resizeGame(){const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35))}addEventListener('resize',resizeGame,{passive:true});if(window.visualViewport)visualViewport.addEventListener('resize',resizeGame,{passive:true});
